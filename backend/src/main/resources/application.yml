server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: meal-savings-api
  datasource:
    # The AWS wrapper creates IAM auth tokens when opening DB connections.
    url: ${DB_JDBC_URL:jdbc:aws-wrapper:postgresql://database-1.cluster-cxe8e82imo9p.ap-southeast-2.rds.amazonaws.com:5432/postgres?sslmode=require}
    username: ${DB_USERNAME:postgres}
    driver-class-name: software.amazon.jdbc.Driver
    hikari:
      pool-name: MealSavingsPostgreSqlPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 1800000
      data-source-properties:
        wrapperPlugins: iam
        iamRegion: ap-southeast-2
        awsProfile: ${AWS_PROFILE:default}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  sql:
    init:
      mode: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      issuer: ${JWT_ISSUER:meal-savings-api}
      secret-base64: ${JWT_SECRET_BASE64}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT30M}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
